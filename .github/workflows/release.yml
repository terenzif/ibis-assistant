name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist, e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: publish-draft
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./cmd/... ./internal/... ./tools/... -short -count=1

      - name: Build release artifacts
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse --short HEAD)"
          mkdir -p dist
          ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}"

          build() {
            local goos="$1" goarch="$2" name="$3"
            echo "building ${name}"
            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags "${ldflags}" -o "dist/${name}" ./cmd/server
          }

          build linux   amd64 ibis-assistant-linux-amd64
          build linux   arm64 ibis-assistant-linux-arm64
          build darwin  amd64 ibis-assistant-darwin-amd64
          build darwin  arm64 ibis-assistant-darwin-arm64
          build windows amd64 ibis-assistant-windows-amd64.exe
          build windows arm64 ibis-assistant-windows-arm64.exe

          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "${ldflags}" -o dist/mcp-bridge-linux-amd64 ./tools/mcp-bridge

          python - <<'PY'
          import pathlib
          import zipfile
          root = pathlib.Path("cursor-plugin")
          out = pathlib.Path("dist/ibis-assistant-cursor-plugin.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(root))
          print(f"wrote {out}")
          PY

          (cd dist && find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          ls -lh dist

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no artifacts in dist/" >&2
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --clobber
            gh release edit "${TAG}" --draft=true --title "${TAG}"
          else
            gh release create "${TAG}" "${assets[@]}" \
              --draft \
              --verify-tag \
              --title "${TAG}" \
              --generate-notes
          fi
          gh release view "${TAG}" --json url,isDraft,tagName
